<script>
let PAYLOAD=null;
async function loadPayload(){const el=document.getElementById('payload');if(el.dataset.encoding==='gzip-base64'){if(!('DecompressionStream' in window))throw new Error('This report embeds a gzip-compressed payload (--compress-payload on), but this browser does not support DecompressionStream. Re-render with --compress-payload off.');const b64=el.textContent.trim(),bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}return JSON.parse(el.textContent)}
const LABELS={details:'Details',roofline:'Roofline',timeline:'Timeline',cache:'Cache','onchip-memory':'On-Chip Memory',source:'Source','warp-stall':'Warp Stall','instruction-timeline':'Instruction Timeline','raw-data':'Raw Data',availability:'Availability'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v):null;
function fmt(v,format='number'){if(v==null||!Number.isFinite(Number(v)))return '—';const n=Number(v);if(format==='percent')return `${n.toFixed(Math.abs(n)>=10?2:3)}%`;if(Math.abs(n)>=1e9)return `${(n/1e9).toFixed(2)}G`;if(Math.abs(n)>=1e6)return `${(n/1e6).toFixed(2)}M`;if(Math.abs(n)>=1e3)return `${(n/1e3).toFixed(2)}k`;if(Math.abs(n)>=100)return n.toFixed(1);if(Math.abs(n)>=1)return n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');return n.toPrecision(4)}
function emptyCanvas(){return '<div class="empty-canvas"></div>'}
function section(title,body,controls=''){return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2><div class="controls">${controls}</div></div>${body}</section>`}
function card(body,cls=''){return `<div class="card ${cls}">${body}</div>`}
function colorScale(v,min,max){if(v==null||!Number.isFinite(v))return '#f1f5f9';if(max<=min)return '#9db7ef';const t=Math.max(0,Math.min(1,(v-min)/(max-min)));const a=[238,242,247],b=[36,87,214];const rgb=a.map((x,i)=>Math.round(x+(b[i]-x)*t));return `rgb(${rgb.join(',')})`}
function buildTabs(){const tabs=$('#tabs');tabs.innerHTML=PAYLOAD.pages.map((p,i)=>`<button class="tab ${i===0?'active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-page="${p}">${LABELS[p]||p}</button>`).join('');tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;$$('.tab',tabs).forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',on?'true':'false')});$$('.view').forEach(v=>v.classList.toggle('active',v.dataset.page===b.dataset.page));activatePage(b.dataset.page)});}
function buildCoverage(){const bar=$('#coverageBar'),requested=PAYLOAD.requested_pages||PAYLOAD.pages||[],rendered=(PAYLOAD.module_status||[]).filter(x=>x.available),omitted=PAYLOAD.omitted_modules||[];if(!bar||(!requested.length&&!omitted.length))return;const chips=[`<span class="coverage-chip">Rendered ${rendered.length} / Requested ${requested.length}</span>`];omitted.forEach(x=>chips.push(`<span class="coverage-chip omitted">Omitted: ${esc(LABELS[x.page]||x.page)} · ${esc(x.reason||'unavailable')}</span>`));bar.innerHTML=chips.join('');bar.classList.add('visible')}
/* Basic information */
function renderBasic(data){if(!data?.available)return '';const cards=[['Name',data.name||'—'],['Duration (μs)',Number.isFinite(num(data.duration_us))?Number(data.duration_us).toFixed(3):'—'],['Op Type',data.op_type||'—'],['Block Dim',data.block_dim||'—'],['SoC',data.soc||'—'],['Device',data.device_id||'—'],['Current / Rated Freq (MHz)',Number.isFinite(num(data.current_frequency_mhz))?`${fmt(data.current_frequency_mhz)} / ${Number.isFinite(num(data.rated_frequency_mhz))?fmt(data.rated_frequency_mhz):'—'}`:'—'],['Frequency Ratio',Number.isFinite(num(data.frequency_ratio_percent))?`${Number(data.frequency_ratio_percent).toFixed(1)}%`:'—']].filter(x=>x[1]!=='—'||['Name','Duration (μs)','Op Type','Block Dim'].includes(x[0]));const html=section('Basic Information',`<div class="grid4">${cards.map(x=>`<div class="panel basic-card"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div><div class="panel duration-wrap"><div class="duration-head"><div class="label">Block Duration</div><div class="muted">Hover to inspect individual blocks</div></div><svg id="durationSvg" class="duration-chart"></svg></div>`);setTimeout(()=>initBasic(data),0);return html}
function initBasic(data){const draw=()=>{const svg=$('#durationSvg');if(!svg)return;const rows=data.blocks||[];if(!rows.length){svg.innerHTML='';return}const W=Math.max(svg.clientWidth,800),H=165,p={l:48,r:12,t:12,b:28};svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const vals=rows.map(x=>num(x.duration_us)).filter(Number.isFinite);const min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,.001),base=Math.max(0,min-range*.18),top=max+range*.08;const sx=i=>p.l+i*(W-p.l-p.r)/rows.length,barW=Math.max(2,(W-p.l-p.r)/rows.length-2),sy=v=>p.t+(top-v)/(top-base)*(H-p.t-p.b);let h='';for(let i=0;i<4;i++){const v=base+(top-base)*i/3,y=sy(v);h+=`<line x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}" stroke="#e7ebf1"/><text x="${p.l-7}" y="${y+3}" text-anchor="end" font-size="9" fill="#98a2b3">${v.toFixed(1)}</text>`}rows.forEach((r,i)=>{const v=num(r.duration_us),x=sx(i)+1,y=sy(v),hh=H-p.b-y;h+=`<rect class="duration-bar" data-i="${i}" x="${x}" y="${y}" width="${barW}" height="${Math.max(1,hh)}" rx="1.5" fill="#b8cdf8"/>`});const step=Math.max(1,Math.ceil(rows.length/8));for(let i=0;i<rows.length;i+=step)h+=`<text x="${sx(i)+barW/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="#98a2b3">${esc(rows[i].block_id)}</text>`;h+=`<text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" text-anchor="middle" font-size="9" fill="#667085">Duration (μs)</text>`;svg.innerHTML=h;const tip=$('#chartTooltip');$$('.duration-bar',svg).forEach(el=>{el.onmousemove=e=>{const r=rows[Number(el.dataset.i)];tip.innerHTML=`Block ${esc(r.block_id)}<br><b>${Number(r.duration_us).toFixed(6)} μs</b>`;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.opacity=1;el.setAttribute('fill','#5f8fe8')};el.onmouseleave=()=>{tip.style.opacity=0;el.setAttribute('fill','#b8cdf8')}})};draw();window.addEventListener('resize',draw,{passive:true})}
/* Occupancy */
function quantile(vals,q){const a=[...vals].sort((x,y)=>x-y);if(!a.length)return NaN;const p=(a.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(p-lo)}
function outlierModel(vals){const v=vals.filter(Number.isFinite),med=quantile(v,.5),abs=v.map(x=>Math.abs(x-med)),mad=quantile(abs,.5),q1=quantile(v,.25),q3=quantile(v,.75),iqr=q3-q1;return{med,classify(x){if(!Number.isFinite(x))return'missing';if(mad>0){const z=.6745*(x-med)/mad;if(z>3.5)return'high';if(z<-3.5)return'low';return'normal'}const low=q1-1.5*iqr,high=q3+1.5*iqr;if(x>high)return'high';if(x<low)return'low';if(med!==0&&x>med*1.25)return'high';if(med!==0&&x<med*.75)return'low';return'normal'}}}

 const drawInstructions=(scrollTarget=null)=>{const rows=filteredInstructions();currentInstructionRows=rows;$('#sourceShown').textContent=`${rows.length} shown · ${data.instructions.length} total`;instBody.innerHTML=rows.map(i=>`<div class="source-inst-row ${i._related?'related':''} ${i.id===selectedInstruction?'selected':''}" data-id="${esc(i.id)}"><div title="${i.index}">${i.index}</div><div title="${esc(i.address)}">${esc(i.address)}</div><div class="pipe" title="${esc(i.pipe)}">${esc(i.pipe)}</div><div class="op" title="${esc(i.opcode)}">${esc(i.opcode)}</div><div class="num" title="${i.executed?fmt(i.executed):'0'}">${i.executed?fmt(i.executed):'0'}</div><div class="num" title="${fmt(i.gpr_count)}">${fmt(i.gpr_count)}</div><div class="source-gpr-slot"></div><div>${sourceStallBar(i.stall_all,true)}</div><div>${sourceStallBar(i.stall_not_issue,true)}</div></div>`).join('');requestGprPaint(rows);$$('.source-inst-row',instBody).forEach(row=>row.onclick=()=>selectInstruction(row.dataset.id));updateStatus();if(scrollTarget){const row=scrollTarget==='related'?$('.source-inst-row.related',instBody):$(`.source-inst-row[data-id="${scrollTarget}"]`,instBody);scrollRow(instScroll,row)}};

 const drawDetail=(i)=>{detail.classList.add('visible');const g=(i.gpr_status||[]).map(x=>`${x.register}: status=${x.status}, survival=${x.survival_time}`).join(' · ')||'No GPR status rows',relations=(i.related_lines||[]).map(x=>`${data.files.find(f=>f.id===x.file_id)?.name||x.file_id}:${x.line} [${(x.reasons||[]).join(', ')}]`).join(' · ')||'No source relation';detail.innerHTML=`<button class="source-detail-close" title="Close">×</button><div class="source-detail-grid"><div class="source-detail-item"><div class="label">Address</div><div class="value">${esc(i.address)}</div></div><div class="source-detail-item"><div class="label">Pipe / opcode</div><div class="value">${esc(i.pipe+' / '+i.opcode)}</div></div><div class="source-detail-item"><div class="label">Instructions executed</div><div class="value">${fmt(sourceExecuted(i,core()))}</div></div><div class="source-detail-item"><div class="label">GPR count</div><div class="value">${fmt(i.gpr_count)}</div></div><div class="source-detail-item" style="grid-column:1/-1"><div class="label">Source bindings</div><div class="value">${esc(relations)}</div></div><div class="source-detail-item source-stall-detail"><div class="label">Stall sampling</div><div class="value">${stallBreakdown('All Samples',i.stall_all)}${stallBreakdown('Not Issue',i.stall_not_issue)}</div></div><div class="source-detail-item source-gpr-raw"><div class="label">Raw GPR status</div><div class="value">${esc(g)}</div></div></div>`;$('.source-detail-close',detail).onclick=hideDetail};
 fileSel.onchange=()=>{selectedLine=(getFile()?.lines||[]).find(x=>x.mapped)?.number||1;selectedInstruction=null;hideDetail();drawCode(true);drawInstructions('related')};coreSel.onchange=()=>{drawCode();drawInstructions(selectedInstruction);if(selectedInstruction)drawDetail(instById[selectedInstruction])};pipeSel.onchange=()=>drawInstructions(selectedInstruction||'related');search.oninput=()=>drawInstructions(selectedInstruction||null);only.onchange=()=>drawInstructions(selectedInstruction||'related');$$('[data-sort]',$('.source-inst-head')).forEach(h=>h.onclick=()=>{const k=h.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}drawInstructions(selectedInstruction||'related')});
 if(splitter&&layout){let dragging=false;splitter.addEventListener('pointerdown',e=>{dragging=true;layout.classList.add('resizing');splitter.classList.add('dragging');splitter.setPointerCapture(e.pointerId)});splitter.addEventListener('pointermove',e=>{if(!dragging)return;const rect=layout.getBoundingClientRect(),pct=Math.max(30,Math.min(68,(e.clientX-rect.left)/rect.width*100));layout.style.setProperty('--source-left',pct+'%');requestGprPaint()});const stop=()=>{dragging=false;layout.classList.remove('resizing');splitter.classList.remove('dragging');requestGprPaint()};splitter.addEventListener('pointerup',stop);splitter.addEventListener('pointercancel',stop);if(window.ResizeObserver){const ro=new ResizeObserver(()=>requestGprPaint());ro.observe(layout);ro.observe(instBody)}}
 drawCode(true);drawInstructions('related')
}

function renderStall(data){if(!data?.available)return renderUnavailable(data,'Warp Stall');const max=Math.max(...data.categories.map(x=>Math.abs(x.value)||0),1),bars=card(`<div class="bar-list">${data.categories.map(x=>`<div class="bar-row"><div class="bar-label">${esc(x.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.abs(x.value)/max*100}%"></div></div><div class="bar-val">${fmt(x.value)}${Number.isFinite(num(x.share_percent))?` · ${Number(x.share_percent).toFixed(1)}%`:''}</div></div>`).join('')}</div>`),table=(data.pcs||[]).length?card(`<div class="scroll"><table class="pc-table"><thead><tr><th>PC</th><th>Pipe / Opcode</th><th>Source</th><th>Top Reason</th><th>Stall %</th><th>Samples</th></tr></thead><tbody>${data.pcs.map(x=>`<tr><td>${esc(x.pc)}</td><td>${esc([x.pipe,x.opcode].filter(Boolean).join(' / '))}</td><td>${esc(x.source_location||'')}</td><td>${esc(x.reason)}</td><td>${fmt(x.value)}</td><td>${fmt(x.samples)}</td></tr>`).join('')}</tbody></table></div>`):'';return `<div class="grid2">${bars}${table}</div>`}
function renderRaw(data){if(!data?.available)return emptyCanvas();const opts=data.tables.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join(''),html=`<div class="card"><div class="raw-toolbar"><select id="rawTableSelect">${opts}</select><input id="rawSearch" placeholder="Search current table"><span class="raw-meta" id="rawMeta"></span></div><div class="scroll"><table class="raw-table"><thead id="rawHead"></thead><tbody id="rawBody"></tbody></table></div></div>`;setTimeout(()=>initRaw(data),0);return html}
function initRaw(data){const sel=$('#rawTableSelect'),search=$('#rawSearch');if(!sel)return;let sortKey=null,sortDir=1,searchTimer=null;const cell=(r,h,i)=>Array.isArray(r)?r[i]:r[h];const draw=()=>{const t=data.tables[Number(sel.value)];let rows=[...(t.rows||[])];const q=(search.value||'').toLowerCase();if(q)rows=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));if(sortKey){const si=t.headers.indexOf(sortKey);rows.sort((a,b)=>{const av=cell(a,sortKey,si)??'',bv=cell(b,sortKey,si)??'',an=num(av),bn=num(bv);return((an!=null&&bn!=null)?an-bn:String(av).localeCompare(String(bv)))*sortDir})}$('#rawHead').innerHTML=`<tr>${t.headers.map(h=>`<th data-key="${esc(h)}">${esc(h)}</th>`).join('')}</tr>`;$('#rawBody').innerHTML=rows.map(r=>`<tr>${t.headers.map((h,i)=>`<td>${esc(cell(r,h,i)??'')}</td>`).join('')}</tr>`).join('');const truncated=Number(t.total_rows)>Number(t.embedded_rows);$('#rawMeta').textContent=`${rows.length} shown · ${t.total_rows} total${truncated?` · first ${t.embedded_rows} embedded`:''}`;$$('th',$('#rawHead')).forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=1}draw()}))};sel.addEventListener('change',()=>{sortKey=null;search.value='';draw()});search.addEventListener('input',()=>{if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(draw,150)});draw()}
function renderUnavailable(data,title='Module unavailable'){const d=data?.diagnostic||{},e=Array.isArray(d.evidence)?d.evidence:[];return `<div class="unavailable-card"><h2>${esc(d.title||title)}</h2><p>${esc(d.explanation||'No semantically usable visualization payload was produced for this module.')}</p>${e.length?`<div class="unavailable-evidence">${e.map(x=>`<div>${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join('')}</div>`:''}</div>`}
function renderAvailability(data){const rows=data?.requested_modules||[];return `<div class="unavailable-card"><h2>Requested modules are unavailable</h2><p>${esc(data?.message||'No requested module can be rendered.')}</p><div class="unavailable-evidence">${rows.map(x=>`<div>${esc(LABELS[x.page]||x.page)} · ${esc(x.collector_status||'unknown')} · ${esc(x.reason||'no usable payload')}</div>`).join('')}</div></div>`}
function renderPage(page,data){if(page==='availability')return renderAvailability(data);if(data?.available===false&&data?.diagnostic)return renderUnavailable(data,LABELS[page]||page);if(page==='details')return renderDetails(data);if(page==='roofline')return renderRoofline(data);if(page==='timeline')return renderTimeline(data,'timeline');if(page==='cache')return renderCache(data);if(page==='onchip-memory')return renderOnChipMemory(data);if(page==='source')return renderSource(data);if(page==='warp-stall')return renderStall(data);if(page==='instruction-timeline')return renderTimeline(data,'instruction');if(page==='raw-data')return renderRaw(data);return emptyCanvas()}
function activatePage(page){const view=$(`.view[data-page="${page}"]`);if(!view||view.dataset.rendered)return;view.dataset.rendered='1';view.innerHTML=renderPage(page,PAYLOAD.views[page])}
function renderApp(){const sourceOnly=PAYLOAD.pages.length===1&&PAYLOAD.pages[0]==='source';document.body.classList.toggle('source-immersive',sourceOnly);buildTabs();buildCoverage();const app=$('#app');app.innerHTML=PAYLOAD.pages.map((p,i)=>`<section class="view ${i===0?'active':''}" data-page="${p}"></section>`).join('');activatePage(PAYLOAD.pages[0])}
loadPayload().then(payload=>{PAYLOAD=payload;renderApp()}).catch(err=>{console.error(err);const app=document.getElementById('app');if(app)app.innerHTML=`<div class="unavailable-card"><h2>Report payload failed to load</h2><p>${String(err&&err.message||err)}</p></div>`});
</script>
</body>
